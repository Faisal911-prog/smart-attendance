# Render Blueprint: one backend web service + one static front-end site.
#
# The database is NOT created here on purpose: Render's free PostgreSQL is
# deleted after 30 days. Create a free database at a provider with a longer-lived
# free tier (Neon, Supabase, ...) and paste its connection string into the
# DATABASE_URL variable of the backend service (Render asks for it because of "sync: false").
#
# Replace "smart-attendance-api" / "smart-attendance-web" below if those names are taken.
services:
  - type: web
    name: smart-attendance-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false        # e.g. https://smart-attendance-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false        # same value as FRONTEND_URL
      - key: ALLOWED_HOSTS
        value: ".onrender.com"

  - type: web
    name: smart-attendance-web
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false        # e.g. https://smart-attendance-api.onrender.com
      - key: VITE_DEMO_MODE
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
